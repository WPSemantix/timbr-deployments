namespaceOverride: ""
createNamespace: false

# NGINX Ingress Controller (for generic/non-cloud-native deployments)
# Set to false if using cloud provider's ingress (ALB, App Gateway, GCE)
nginx-ingress:
  enabled: true  # Set to true for generic Kubernetes clusters
  namespaceOverride: ""  # Will use parent chart's namespace
  controller:
    name: controller
    ingressClassResource:
      name: nginx
      enabled: true
      default: false
    service:
      type: LoadBalancer  # Use NodePort for local clusters without LB support
      namespaceOverride: ""  # Ensure service is in same namespace
      externalTrafficPolicy: Local
      annotations:
        service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
    # Deploy in the same namespace as Timbr
    scope:
      enabled: true

# Cloud provider configuration
# Supported values: aws, azure, gcp, generic
cloudProvider:
  type: aws

global:
  imagePullSecrets:
    - timbr-registry-cred
  labels: {}

secrets:
  create: true
  existingSecretName: ""
  data:
    mysqlRootPassword: "welcome"
    postgresPassword: "db_pass"   # POSTGRES_DB_PASSWORD / DB_PASSWORD / TIMBR_DB_PASSWORD (db.type=postgres)
    llmApiKey: ""            # TIMBR_LLM_APIKEY
    oauthSecret: ""          # OAUTH_SECRET
    azureClientSecret: ""    # AZURE_CLIENT_SECRET
    teamsAppPassword: ""     # CHAT_BOT_TEAMS_APP_PASSWORD
    slackBotToken: ""        # CHAT_BOT_SLACK_BOT_TOKEN
    slackSigningSecret: ""   # CHAT_BOT_SLACK_SIGNING_SECRET
    mcpOauthClientSecret: "" # MCP_OAUTH_CLIENT_SECRET

# In-cluster MySQL metadata database. Used when db.type = mysql.
mysql:
  enabled: true
  name: timbr-mysql
  image: timbr.azurecr.io/timbr-mysql-8:latest
  replicas: 1
  service:
    type: ClusterIP
    port: 3306
  persistence:
    enabled: true
    size: 30Gi
    storageClassName: ""  # Auto-detected based on cloudProvider: gp3 (AWS), managed-csi (Azure), standard-rwo (GCP)
  env:
    MYSQL_ROOT_PASSWORD_SECRET_KEY: mysqlRootPassword
    MYSQL_DATABASE: timbr_platform

# In-cluster PostgreSQL 17 metadata database. Used when db.type = postgres.
# Set postgres.enabled=true and mysql.enabled=false to switch backends.
# Leave both disabled to point db.host at a managed PostgreSQL service - see
# "Using a Managed PostgreSQL Service" in DEPLOY_WITH_POSTGRES.md.
postgres:
  enabled: false
  name: timbr-postgres
  image: timbr.azurecr.io/timbr-postgres:latest   # ships PostgreSQL 17
  replicas: 1
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    size: 30Gi
    storageClassName: ""  # Auto-detected based on cloudProvider: gp3 (AWS), managed-csi (Azure), standard-rwo (GCP)
  env:
    POSTGRES_DB_PASSWORD_SECRET_KEY: postgresPassword

db:
  # Metadata database backend: mysql | postgres.
  # Everything below is auto-derived from this unless you set it explicitly.
  type: mysql
  host: ""              # default: mysql.name (mysql) / postgres.name (postgres)
  port: ""              # default: 3306 (mysql) / 5432 (postgres)
  user: ""              # default: root (mysql) / postgres (postgres)
  passwordSecretKey: "" # default: db.rootPasswordSecretKey (mysql) / postgresPassword (postgres)
  jdbcParams: ""        # default: useSSL=false&allowPublicKeyRetrieval=true (mysql) / none (postgres)
  rootPasswordSecretKey: mysqlRootPassword

  # MySQL layout: two separate databases.
  platformDb: timbr_platform
  serverDb: timbr_server

  # PostgreSQL layout: one database holding several schemas.
  database: timbr
  schema: timbr_platform          # POSTGRES_SCHEMA_NAME
  serverSchema: timbr_server      # TIMBR_SERVER_SCHEMA
  metastoreSchema: timbr_metastore

ingress:
  enabled: true
  className: ""  # Auto-detected based on cloudProvider: alb (AWS), azure-application-gateway (Azure), gce (GCP), nginx (generic)
  host: ""
  
  # AWS-specific configuration (when cloudProvider.type = aws)
  aws:
    scheme: internet-facing     # internet-facing | internal
    targetType: ip              # ip | instance
  
  # Azure-specific configuration (when cloudProvider.type = azure)
  azure:
    backendProtocol: http       # http | https
    sslRedirect: false
    usePrivateIp: false
  
  # GCP-specific configuration (when cloudProvider.type = gcp)
  gcp:
    staticIpName: ""            # Optional: name of pre-allocated static IP
    globalStaticIp: false       # true for global LB, false for regional
  
  # TLS/SSL configuration
  tls:
    enabled: false
    source: ""                  # acm (AWS) | keyvault (Azure) | secret (generic)
    certificateArn: ""          # For AWS ACM
    secretName: ""              # For Kubernetes secret-based TLS
    azureKeyVault:
      secretId: ""              # For Azure Key Vault integration
  
  # Additional annotations (merged with cloud-specific ones)
  annotations: {}
  
  # External DNS configuration (optional)
  externalDNS:
    enabled: false
    hostname: ""

imagePullSecrets:
  - name: timbr-registry-cred

components:
  platform:
    enabled: true
    name: timbr-platform
    image: timbr.azurecr.io/timbr-platform-stable:latest
    replicas: 1
    service:
      type: ClusterIP
      port: 8088
    env:
      SQLLAB_LIMIT: "1000"
      FLASK_ENV: "production"
      FLASK_DEBUG: "1"
      ENABLE_WEBSOCKETS: "true"
      extra: {}
    llm:
      TIMBR_LLM_TYPE: ""
      TIMBR_LLM_MODEL: ""
      TIMBR_LLM_APIKEY_SECRET_KEY: llmApiKey
      TIMBR_LLM_ENDPOINT: ""
      TIMBR_LLM_ADDITIONAL_PARAMS: ""
    oauth:
      OAUTH_CLIENT_ID: ""
      OAUTH_BASE_URL: ""
      OAUTH_SECRET_SECRET_KEY: oauthSecret
      OAUTH_PROVIDER: ""          # google|azure|okta|""
      OAUTH_USE_PKCE: "true"
      OAUTH_SCOPES: ""
      OAUTH_ROLE_MAPPING_ENABLED: "false"
      OAUTH_ROLE_MAPPING: "{}"
      OAUTH_ROLE_MAPPING_DEFAULT: ""
      OAUTH_ROLE_MAPPING_STRATEGY: "highest"
      OAUTH_ROLE_PRIORITY: "admin,editor,analyst,viewer"
      AUTH_USER_REGISTRATION: ""
      AUTH_USER_REGISTRATION_ROLE: ""
      AZURE_TENANT_ID: ""
      AZURE_CLIENT_ID: ""
      AZURE_CLIENT_SECRET_SECRET_KEY: azureClientSecret

  api:
    enabled: true
    name: timbr-api
    image: timbr.azurecr.io/timbr-api:latest
    replicas: 1
    service:
      type: ClusterIP
      port: 9000
    env:
      ENABLE_USER_TOKEN: "true"
      extra: {}
    llm:
      TIMBR_LLM_TYPE: ""
      TIMBR_LLM_MODEL: ""
      TIMBR_LLM_APIKEY_SECRET_KEY: llmApiKey
      TIMBR_LLM_ENDPOINT: ""
      TIMBR_LLM_ADDITIONAL_PARAMS: ""

    # Microsoft Teams / Slack chat bot. Requires the llm block above and a
    # publicly reachable HTTPS host. Empty values render no env var at all.
    # See "How to setup the Timbr Chat Bot for Microsoft Teams and Slack"
    # in DEPLOYMENTS_OPTIONAL_SERVICES.md.
    chatBot:
      ENABLE_CHAT_BOT: ""                 # "true" to switch the chat bot on
      CHAT_BOT_DEFAULT_ONTOLOGY: ""       # set exactly one of ONTOLOGY or AGENT
      CHAT_BOT_DEFAULT_AGENT: ""
      CHAT_BOT_DEFAULT_PARAMS: ""
      # Microsoft Teams (Azure Bot registration)
      CHAT_BOT_TEAMS_APP_ID: ""
      CHAT_BOT_TEAMS_TENANT_ID: ""        # required for single-tenant bots
      CHAT_BOT_TEAMS_APP_PASSWORD_SECRET_KEY: teamsAppPassword
      # Slack
      CHAT_BOT_SLACK_BOT_TOKEN_SECRET_KEY: slackBotToken
      CHAT_BOT_SLACK_SIGNING_SECRET_SECRET_KEY: slackSigningSecret
      # Limits and TTLs (defaults applied by timbr-api when left empty)
      CHAT_BOT_MAX_PREVIEW_ROWS: ""             # default 50
      CHAT_BOT_MAX_EXPORT_ROWS: ""              # default 10000
      CHAT_BOT_RESULT_STATE_TTL_SECONDS: ""     # default 86400
      CHAT_BOT_IDENTITY_CACHE_TTL_SECONDS: ""   # default 3600
      CHAT_BOT_DEDUP_TTL_SECONDS: ""            # default 300
      CHAT_BOT_INFLIGHT_TTL_SECONDS: ""         # default 120

    # OAuth for the MCP server exposed at /timbr/api/mcp.
    # Setting MCP_OAUTH_ENABLED also publishes the three .well-known discovery
    # paths on the Ingress. AUTHORIZATION_SERVER, JWKS_URL, AUDIENCE and ISSUER
    # are auto-derived from the JWT configuration when left empty.
    # See "How to setup MCP OAuth authentication for timbr-api"
    # in DEPLOYMENTS_OPTIONAL_SERVICES.md.
    mcpOauth:
      MCP_OAUTH_ENABLED: ""
      MCP_OAUTH_RESOURCE_URL: ""          # e.g. https://timbr.example.com
      MCP_OAUTH_AUTHORIZATION_SERVER: ""
      MCP_OAUTH_JWKS_URL: ""
      MCP_OAUTH_AUDIENCE: ""
      MCP_OAUTH_ISSUER: ""
      MCP_OAUTH_SCOPES: ""                # e.g. api://<resource-app-client-id>/.default
      MCP_OAUTH_DCR_ENABLED: ""           # "true" for Copilot Studio / Claude Desktop
      MCP_OAUTH_CLIENT_ID: ""
      MCP_OAUTH_CLIENT_SECRET_SECRET_KEY: mcpOauthClientSecret

  server:
    enabled: true
    name: timbr-server
    image: timbr.azurecr.io/timbr-server-stable:latest
    replicas: 1
    service:
      type: ClusterIP
      port: 11000
    env:
      # TIMBR_DB_JDBC, TIMBR_DB_JDBC_DRIVER and TIMBR_DB_JDBC_PARAMS are derived
      # from db.type - override with db.jdbcParams or env.extra if needed.
      TIMBR_CONNECTION_WORKER_THREADS: "100"
      TIMBR_OPERATION_WORKER_THREADS: "50"
      extra: {}

  mdx:
    enabled: true
    name: timbr-mdx
    image: timbr.azurecr.io/timbr-mdx:latest
    replicas: 1
    service:
      type: ClusterIP
      port: 12000
    env:
      TIMBR_PUBLIC_HOSTNAME: timbr-server
      extra: {}

  ga:
    enabled: true
    name: timbr-ga
    image: timbr.azurecr.io/timbr-ga:latest
    replicas: 1
    service:
      type: ClusterIP
      port: 12000
    env:
      PYTHONUNBUFFERED: "1"
      extra: {}

  scheduler:
    enabled: true
    name: timbr-scheduler
    image: timbr.azurecr.io/timbr-scheduler:latest
    replicas: 1
    env:
      PYTHONUNBUFFERED: "1"
      extra: {}

  cache:
    enabled: true
    name: timbr-cache
    image: timbr.azurecr.io/timbr-cache:latest
    replicas: 1
    service:
      type: ClusterIP
      port: 8123
    persistence:
      enabled: true
      existingClaim: ""
      size: 50Gi
      storageClassName: ""  # Auto-detected based on cloudProvider

  virtualization:
    enabled: true
    name: timbr-virtualization
    image: timbr.azurecr.io/timbr-virtualization-v2:latest
    replicas: 1
    service:
      type: ClusterIP
      port: 10000
    persistence:
      enabled: true
      existingClaim: ""
      size: 50Gi
      storageClassName: ""  # Auto-detected based on cloudProvider
    env:
      extra: {}
